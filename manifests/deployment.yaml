
apiVersion: apps/v1
kind: Deployment

metadata:
  name: repo2-deployment
  namespace: production
  labels:
    app: repo2
    tier: frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: repo2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: repo2
        tier: frontend

    spec:
      containers:
        - name: repo2
            image: 8089278330/repo2:2
          imagePullPolicy: Always

          ports:
            - containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

      restartPolicy: Always
